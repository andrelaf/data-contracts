# Verificacao de contrato de dados em pull request.
#
# Este repositorio nao tem Rust, nao tem `src/`, nao tem glossario e nao tem
# catalogo de classificacao. Tem contratos — e so.
#
# A ferramenta que julga vem de fora, fixada por **versao e sha256**, e traz o
# criterio consigo. Tres consequencias, e sao elas que justificam o desenho:
#
#   1. Quem escreve o contrato nao escreve o criterio que o julga. Nao por
#      convencao nem por CODEOWNERS bem preenchido: por nao ter o arquivo.
#   2. O veredito e reproduzivel. Subir a versao do pacote e um commit neste
#      repositorio, revisado como qualquer outro — nunca um efeito de alguem ter
#      publicado algo em outro lugar.
#   3. Este YAML nao decide nada. Ele baixa, confere o hash e chama. Toda a
#      politica esta no binario, testada la.

name: contrato

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contrato-pr.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: contrato-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Qual criterio julga este repositorio — repo, versao e sha256. Vive em
      # `harness.lock` e nao neste YAML porque quem roda a verificacao na
      # propria maquina le o mesmo arquivo. Duas declaracoes divergiriam no dia
      # em que uma das duas subisse de versao.
      - name: ler a versao fixada
        run: grep -E '^[A-Z_]+=' harness.lock >> "$GITHUB_ENV"

      # --- 1. A ferramenta ---------------------------------------------------
      #
      # `gh release download` em vez de `curl`: funciona igual em repositorio
      # privado, que e onde isto vai acabar morando.
      - name: baixar o pacote de validacao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$HARNESS_VERSAO" \
            --repo "$HARNESS_REPO" \
            --pattern 'harness-odcs-linux-x64.tar.gz' \
            --dir "$RUNNER_TEMP"

      # A verificacao que da sentido ao "fixado". Sem ela, `HARNESS_VERSAO`
      # seria uma etiqueta, e etiqueta se move.
      - name: conferir o sha256
        run: |
          echo "$HARNESS_SHA256  $RUNNER_TEMP/harness-odcs-linux-x64.tar.gz" \
            | sha256sum --check --strict

      - name: extrair
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/harness-odcs-linux-x64.tar.gz"

      # A procedencia do criterio, no log do job: versao do harness, commit, e
      # sha256 do glossario e do catalogo que vao julgar este contrato.
      - name: procedencia
        run: cat "$RUNNER_TEMP/harness-odcs/VERSION"

      # --- 2. O motor de validacao -------------------------------------------
      #
      # Puxa a imagem do datacontract-cli e confere o digest. A regra esta
      # dentro do pacote, nao aqui: repetir a verificacao neste YAML criaria uma
      # segunda fonte de verdade sobre qual imagem e a certa.
      - name: preparar o motor de validacao
        run: "$RUNNER_TEMP/harness-odcs/scripts/imagem.sh"

      # --- 3. A verificacao --------------------------------------------------
      #
      # A ferramenta visita o repositorio: `harness.sh` roda a partir do
      # diretorio de trabalho, que e o checkout. Uma unica execucao — 99,6% do
      # custo medido e partida de container, entao os passos seguintes apenas
      # redesenham o relatorio ja gravado.
      - name: verificar contrato
        id: check
        run: |
          set +e
          "$RUNNER_TEMP/harness-odcs/harness.sh" check \
            --formato github --saida "$RUNNER_TEMP/report.json"
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: resumo do job
        if: always()
        run: |
          "$RUNNER_TEMP/harness-odcs/harness.sh" report "$RUNNER_TEMP/report.json" \
            --formato markdown >> "$GITHUB_STEP_SUMMARY"

      - name: comentar no pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/harness-odcs/harness.sh" report "$RUNNER_TEMP/report.json" \
            --formato markdown > "$RUNNER_TEMP/comentario.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comentario.md" --edit-last \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/comentario.md"

      # O contrato enriquecido e o laudo propostos, mais o rastro. Aqui eles sao
      # **artefato**, e nao commit: o laudo entra no repositorio quando quem
      # abriu o PR aceitar a proposta, no mesmo commit que a revisao aprova.
      - name: artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrato-${{ github.run_id }}
          path: |
            evidence/
            trace/
          retention-days: 30

      # `5` — gate aberto — nao reprova: nada esta errado no contrato, falta
      # decisao humana. Quem segura o merge e a revisao de CODEOWNER.
      - name: veredito
        run: |
          case "${{ steps.check.outputs.codigo }}" in
            0) echo "contrato aprovado na verificacao automatica" ;;
            5) echo "::notice::aguardando decisao humana — o merge fica com a revisao de CODEOWNER" ;;
            *) echo "::error::verificacao reprovou (exit ${{ steps.check.outputs.codigo }})"; exit 1 ;;
          esac
